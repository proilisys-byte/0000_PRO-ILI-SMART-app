name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '0000_PRO-ALI-SMART-app/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: 0000_PRO-ALI-SMART-app

    - name: Generate Prisma client
      run: npx prisma generate
      working-directory: 0000_PRO-ALI-SMART-app

    - name: Run lint
      run: npm run lint
      working-directory: 0000_PRO-ALI-SMART-app

    - name: Run typecheck
      run: npm run typecheck
      working-directory: 0000_PRO-ALI-SMART-app

    - name: Run AI Quality Evaluation (Mock Mode)
      run: npm run evaluate:ai
      env:
        MOCK_AI: 'true'
      working-directory: 0000_PRO-ALI-SMART-app
